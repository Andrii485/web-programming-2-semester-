<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriber Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto px-4 py-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Керування підписниками</h1>
            <p class="text-gray-600">Перегляд даних через проксі-сервер Laravel</p>
        </header>

        <!-- Таблиця -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full leading-normal">
                <thead>
                    <tr class="bg-gray-800 text-white">
                        <th class="px-5 py-3 border-b-2 text-left text-xs font-semibold uppercase tracking-wider">Ім'я</th>
                        <th class="px-5 py-3 border-b-2 text-left text-xs font-semibold uppercase tracking-wider">Email</th>
                        <th class="px-5 py-3 border-b-2 text-left text-xs font-semibold uppercase tracking-wider">Підписки</th>
                        <th class="px-5 py-3 border-b-2 text-center text-xs font-semibold uppercase tracking-wider">Дії</th>
                    </tr>
                </thead>
                <tbody id="subscribers-list">

                    <tr><td colspan="4" class="text-center py-10">Завантаження...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex justify-between items-center" id="pagination">
            <button id="btn-prev" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 disabled:opacity-50">Назад</button>
            <span id="page-info" class="text-gray-700 font-medium">Сторінка 1</span>
            <button id="btn-next" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 disabled:opacity-50">Вперед</button>
        </div>
    </div>


    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold" id="modal-title">Деталі підписок</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
            </div>
            <div id="modal-content" class="space-y-4">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
